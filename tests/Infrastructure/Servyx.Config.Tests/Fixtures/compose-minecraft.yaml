# Shared settings, pulled into the service below with a merge key.
x-common: &common
  restart: unless-stopped
  stop_grace_period: 60s
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  minecraft:
    <<: *common
    image: itzg/minecraft-server:java21
    container_name: minecraft-server
    ports:
      - "25565:25565/tcp"
      - 25575:25575/tcp
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      MEMORY: 4G
    volumes:
      - ./data:/data
    command: |
      --nogui
      --max-players=20
    labels:
      description: >
        A folded block scalar, which this adapter can read
        but deliberately refuses to write.
    healthcheck:
      test: mc-health
      start_period: 2m
