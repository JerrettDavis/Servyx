apiVersion: servyx.dev/v1
kind: GameDefinition
metadata:
  id: palworld
  name: Palworld Dedicated Server
  version: 1.0.0
  license: MIT
  tags: [survival, steam, unreal]

capabilities:
  network:
    - { port: 8211,  protocol: udp, purpose: game,  var: PORT,       published: true }
    - { port: 27015, protocol: udp, purpose: query, var: QUERY_PORT, published: true }
    - { port: 25575, protocol: tcp, purpose: rcon,  var: RCON_PORT,  published: false }
    - { port: 8212,  protocol: tcp, purpose: rest,  var: REST_API_PORT, published: false }
  filesystem:
    - { path: "${DATA_DIR}", access: rw, purpose: "config, saves, image-managed backups" }
  egress: []          # image self-updates; Servyx downloads nothing for this deployment
  shell: false
  privileged: false
  hostNetwork: false

deployments:

  # -- Profile A: the image the user is actually running ----------------------
  - id: docker-thijsvanloef
    kind: docker
    detect:                       # how adoption recognises an existing container
      imageRepo: "thijsvanloef/palworld-server-docker"
      requiredMounts: [{ containerPath: /palworld }]
    image:
      default: "thijsvanloef/palworld-server-docker:latest"
    dataDir: /palworld
    stopTimeout: 60s

    # Docker's own stop grace period defaults to just 10 SECONDS — nowhere near enough for the ladder
    # below (RCON `shutdown` alone gives players 30s notice and is budgeted 45s; `doexit` and SIGINT add
    # another 15s + 30s on top, for a 90s total). Without this field, Docker would SIGKILL the process at
    # the 10s mark, almost certainly before the in-game shutdown countdown or the save it triggers has
    # finished, corrupting world state. Set to the ladder's total (90s) plus headroom, mirroring the other
    # three shipped definitions' own margin over their ladder totals; the parser hard-errors if this is
    # ever less than the ladder's stage-timeout sum (see ResolveDeferredChecks in
    # GameDefinitionYamlParser.Semantics.cs).
    stopGracePeriodSeconds: 100

    config:
      surfaces:
        # THE source of truth for this image. ~150 keys.
        - id: env
          role: authoritative
          format: dotenv
          locator: { kind: host-file, path: "${COMPOSE_DIR}/.env" }
          mergePolicy: preserve-unknown

        # Ports, volumes, restart policy, container name.
        - id: compose
          role: authoritative
          format: yaml
          locator: { kind: host-file, path: "${COMPOSE_DIR}/compose.yaml" }
          managedSubtree: "services.palworld"
          mergePolicy: preserve-unknown

        # GENERATED by the image entrypoint at boot from `env`. Servyx reads it to
        # compute effective values and detect drift.
        #
        # `mirrorWrites: true` is a NARROW, DECLARED exception and not a change of role: this file really is
        # derived, the entrypoint really does rewrite it from `.env` on every start, and anything Servyx puts
        # here really is discarded at that point. What the flag states is only that this particular generated
        # file tolerates an out-of-band edit BETWEEN regenerations — so an individually opted-in setting can
        # have its authoritative `.env` write mirrored here as well, and take effect without a restart.
        # It permits nothing on its own: each setting must also carry `mirrorWrite: true` on its binding
        # below, the operator must have the per-server (or per-row) mirror toggle on, the container must be
        # running, and a sensitive setting is excluded whatever any of that says.
        - id: palworldsettings
          role: derived
          mirrorWrites: true
          format: ini
          codec: unreal-option-settings
          codecPath: '["/Script/Pal.PalGameWorldSettings"].OptionSettings'
          locator: { kind: host-file,
                     path: "${DATA_DIR}/Pal/Saved/Config/LinuxServer/PalWorldSettings.ini" }
          derivedFrom: [env]
          regeneration:
            kind: container-restart
            description: "Regenerated from .env by the image entrypoint on every start."

        # Live state over a control channel.
        - id: live
          role: runtime
          format: json
          locator: { kind: control-channel, channel: rest, query: "/v1/api/settings" }
          derivedFrom: [palworldsettings]

      # GameUserSettings.ini is client graphics state for this image - declared so the
      # UI can explain its presence, explicitly excluded from binding and backup.
      ignored:
        - path: "${DATA_DIR}/Pal/Saved/Config/LinuxServer/GameUserSettings.ini"
          reason: "Client-side graphics settings; not used by the dedicated server."

  # -- Profile B: bare metal / steamcmd. Same settings, different truth direction.
  - id: native-steamcmd
    kind: process
    executable: { linux: "./PalServer.sh", windows: "PalServer.exe" }
    install:
      - { verb: steamcmd, appId: 2394010, validate: true }
      - { verb: ensure-dir, path: "${DATA_DIR}/Pal/Saved/Config/LinuxServer" }
    config:
      surfaces:
        - id: palworldsettings          # here the INI IS authoritative
          role: authoritative
          format: ini
          codec: unreal-option-settings
          codecPath: '["/Script/Pal.PalGameWorldSettings"].OptionSettings'
          locator: { kind: host-file,
                     path: "${DATA_DIR}/Pal/Saved/Config/LinuxServer/PalWorldSettings.ini" }
          mergePolicy: preserve-unknown

lifecycle:
  ready:
    - kind: log-regex
      pattern: 'Running Palworld dedicated server on \[?[0-9A-Fa-f:.]+\]?:(?<port>\d+)'
      timeout: 10m
    - kind: control-probe            # fallback when upstream changes the log line
      channel: rcon
      command: info
      expect: 'Welcome to Pal Server'
      interval: 15s
      timeout: 12m
  stop:
    - { kind: control, channel: rcon, command: shutdown, args: { seconds: 30, message: "Server shutting down" }, timeout: 45s }
    - { kind: control, channel: rcon, command: doexit, timeout: 15s }
    - { kind: signal, signal: SIGINT, timeout: 30s }
    - { kind: kill }
  crashDetection:
    - { kind: log-regex, pattern: 'Fatal error|Assertion failed', action: mark-crashed }

  # The image's own HEALTHCHECK calls /v1/api/info without admin credentials and gets 401 on every
  # probe, so Servyx must not take it at face value ("ignore") — see the explanation below, shown to an
  # operator whenever this deployment's discovered health is unhealthy.
  healthSignal:
    trust: ignore
    explanation: >-
      The container's own HEALTHCHECK calls http://localhost:8212/v1/api/info without admin
      credentials and receives 401 Unauthorized on every probe. The Palworld server itself is
      healthy — /v1/api/players returns OK on the same polling cycle. Servyx derives readiness
      from its own authenticated detectors, never from this signal.

control:
  channels:
    - id: rcon
      protocol: source-rcon
      port: "${RCON_PORT}"
      passwordRef: "secret:admin-password"
      enabledWhen: "env.RCON_ENABLED == 'true'"
      reachability:                  # ordered; first available wins
        - kind: direct-tcp           # only if the port is published
        - kind: docker-exec-tool     # what actually works on this container
          tool: rcon-cli
          argv: ["rcon-cli", "{command}"]
        - kind: docker-exec-network  # nc/curl from a sibling container on palworld_default
      commands:
        info:      { template: "Info",                       readOnly: true }
        players:   { template: "ShowPlayers",                readOnly: true }
        save:      { template: "Save",                       readOnly: false }
        broadcast: { template: "Broadcast {message}",        readOnly: false }
        kick:      { template: "KickPlayer {playerUid}",     readOnly: false }
        ban:       { template: "BanPlayer {playerUid}",      readOnly: false }
        shutdown:  { template: "Shutdown {seconds} \"{message}\"", readOnly: false }
        doexit:    { template: "DoExit",                     readOnly: false }

    - id: rest
      protocol: palworld-rest
      port: "${REST_API_PORT}"
      enabledWhen: "env.REST_API_ENABLED == 'true'"
      auth: { kind: basic, user: "admin", passwordRef: "secret:admin-password" }
      reachability:
        - kind: direct-tcp
        - kind: docker-exec-tool
          tool: curl
          argv: ["curl", "-sS", "--fail", "-u", "admin:{password}",
                 "http://127.0.0.1:{port}{path}"]
      endpoints:
        players:  { method: GET, path: "/v1/api/players",  readOnly: true }
        info:     { method: GET, path: "/v1/api/info",     readOnly: true }
        metrics:  { method: GET, path: "/v1/api/metrics",  readOnly: true }
        settings: { method: GET, path: "/v1/api/settings", readOnly: true }

    - id: query
      protocol: a2s
      port: "${QUERY_PORT}"
      reachability: [{ kind: direct-tcp }]

  players:
    preferred: [rest.players, rcon.players, query]
    pollInterval: 30s
    parsers:
      rcon.players: { kind: csv-with-header, columns: [name, playerUid, steamId] }

settings:
  # Each item binds ONE writable surface and any number of read surfaces.
  # Servyx computes Desired / Authoritative / Rendered / Runtime and shows drift.
  #
  # `mirrorWrite: true` on a `direction: read` binding is the per-setting half of the dual-write opt-in
  # declared on the `palworldsettings` surface above. It is added ONLY to members where writing the derived
  # copy between regenerations is genuinely harmless and useful:
  #
  #   * NOT on PORT / RCON_PORT — both are `requiresRecreate`, so the container is coming down anyway and the
  #     file will be regenerated from `.env`; mirroring would be a write with no benefit whatsoever.
  #   * NOT on admin-password / server-password — a sensitive value is never mirrored, and the parser refuses
  #     the combination outright. See SettingDescriptor.MirroredBindings.
  - group: Identity
    items:
      - key: SERVER_NAME
        label: Server name
        type: string
        maxLength: 64
        bindings:
          - { surface: env,  direction: write, key: SERVER_NAME }
          - { surface: palworldsettings, direction: read, mirrorWrite: true, member: ServerName, unquote: true }
          - { surface: live, direction: read, pointer: "/servername" }

      - key: SERVER_DESCRIPTION
        label: Description
        type: text
        bindings:
          - { surface: env,  direction: write, key: SERVER_DESCRIPTION }
          - { surface: palworldsettings, direction: read, mirrorWrite: true, member: ServerDescription, unquote: true }

  - group: Networking
    items:
      - key: PORT
        label: Game port
        type: port
        default: 8211
        requiresRecreate: true       # env is baked at container create
        bindings:
          - { surface: env,     direction: write, key: PORT }
          - { surface: compose, direction: write,
              pointer: "/services/palworld/ports", strategy: publish-udp }
          - { surface: palworldsettings, direction: read, member: PublicPort }

      - key: RCON_PORT
        label: RCON port
        type: port
        default: 25575
        publishByDefault: false      # Servyx will not expose RCON to the host network
        bindings:
          - { surface: env, direction: write, key: RCON_PORT }
          - { surface: palworldsettings, direction: read, member: RCONPort }

      - key: QUERY_PORT
        label: Query port (server browser / A2S)
        type: port
        default: 27015
        requiresRecreate: true       # published like PORT; the host port mapping is baked in at container create
        bindings:
          - { surface: env, direction: write, key: QUERY_PORT }

      - key: REST_API_PORT
        label: REST API port
        type: port
        default: 8212
        publishByDefault: false      # matches RCON_PORT: not exposed to the host network by default
        bindings:
          - { surface: env, direction: write, key: REST_API_PORT }
          - { surface: palworldsettings, direction: read, member: RESTAPIPort }

      - key: PUBLIC_IP
        label: Public IP override
        type: string
        default: ""
        bindings:
          - { surface: env, direction: write, key: PUBLIC_IP }
          - { surface: palworldsettings, direction: read, mirrorWrite: true, member: PublicIP, unquote: true }

  - group: Gameplay
    items:
      - key: PLAYERS
        label: Max players
        type: int
        min: 1
        max: 32
        bindings:
          - { surface: env, direction: write, key: PLAYERS }
          - { surface: palworldsettings, direction: read, mirrorWrite: true, member: ServerPlayerMaxNum }

      - key: DIFFICULTY
        label: Difficulty
        type: enum
        values: [None, Casual, Normal, Hard]
        bindings:
          - { surface: env, direction: write, key: DIFFICULTY }
          - { surface: palworldsettings, direction: read, mirrorWrite: true, member: Difficulty }

      - key: DAY_TIME_SPEEDRATE
        label: Day time speed
        type: float
        min: 0.1
        max: 5.0
        step: 0.1
        renderFormat: "F6"           # Unreal wants 1.000000 in the blob
        bindings:
          - { surface: env, direction: write, key: DAY_TIME_SPEEDRATE }
          - { surface: palworldsettings, direction: read, mirrorWrite: true, member: DayTimeSpeedRate }

      - key: ENABLE_PLAYER_TO_PLAYER_DAMAGE
        label: Enable PvP
        type: bool
        trueValue: "True"
        falseValue: "False"
        bindings:
          - { surface: env, direction: write, key: ENABLE_PLAYER_TO_PLAYER_DAMAGE }
          - { surface: palworldsettings, direction: read, mirrorWrite: true,
              member: bEnablePlayerToPlayerDamage }

      - key: NIGHTTIME_SPEEDRATE
        label: Night time speed
        type: float
        min: 0.1
        max: 5.0
        step: 0.1
        default: "1.000000"
        renderFormat: "F6"
        bindings:
          - { surface: env, direction: write, key: NIGHTTIME_SPEEDRATE }
          - { surface: palworldsettings, direction: read, mirrorWrite: true, member: NightTimeSpeedRate }

      - key: EXP_RATE
        label: Experience rate
        type: float
        min: 0.1
        max: 20.0
        step: 0.1
        default: "1.000000"
        renderFormat: "F6"
        bindings:
          - { surface: env, direction: write, key: EXP_RATE }
          - { surface: palworldsettings, direction: read, mirrorWrite: true, member: ExpRate }

      - key: WORK_SPEED_RATE
        label: Work speed rate
        type: float
        min: 0.1
        max: 3.0
        step: 0.1
        default: "1.000000"
        renderFormat: "F6"
        bindings:
          - { surface: env, direction: write, key: WORK_SPEED_RATE }
          - { surface: palworldsettings, direction: read, mirrorWrite: true, member: WorkSpeedRate }

      - key: DEATH_PENALTY
        label: Death penalty
        type: enum
        values: [None, Item, ItemAndEquipment, All]
        default: None
        bindings:
          - { surface: env, direction: write, key: DEATH_PENALTY }
          - { surface: palworldsettings, direction: read, mirrorWrite: true, member: DeathPenalty }

      - key: ENABLE_INVADER_ENEMY
        label: Enable invader enemies
        type: bool
        default: "True"
        trueValue: "True"
        falseValue: "False"
        bindings:
          - { surface: env, direction: write, key: ENABLE_INVADER_ENEMY }
          - { surface: palworldsettings, direction: read, mirrorWrite: true, member: bEnableInvaderEnemy }

      - key: ACTIVE_UNKO
        label: Enable UNKO (poop) items
        type: bool
        default: "False"
        trueValue: "True"
        falseValue: "False"
        bindings:
          - { surface: env, direction: write, key: ACTIVE_UNKO }
          - { surface: palworldsettings, direction: read, mirrorWrite: true, member: bActiveUNKO }

      - key: ENABLE_AIM_ASSIST_PAD
        label: Enable aim assist (gamepad)
        type: bool
        default: "True"
        trueValue: "True"
        falseValue: "False"
        bindings:
          - { surface: env, direction: write, key: ENABLE_AIM_ASSIST_PAD }
          - { surface: palworldsettings, direction: read, mirrorWrite: true, member: bEnableAimAssistPad }

      - key: ENABLE_AIM_ASSIST_KEYBOARD
        label: Enable aim assist (keyboard)
        type: bool
        default: "False"
        trueValue: "True"
        falseValue: "False"
        bindings:
          - { surface: env, direction: write, key: ENABLE_AIM_ASSIST_KEYBOARD }
          - { surface: palworldsettings, direction: read, mirrorWrite: true, member: bEnableAimAssistKeyboard }

      - key: IS_MULTIPLAY
        label: Multiplayer mode
        type: bool
        default: "False"
        trueValue: "True"
        falseValue: "False"
        bindings:
          - { surface: env, direction: write, key: IS_MULTIPLAY }
          - { surface: palworldsettings, direction: read, mirrorWrite: true, member: bIsMultiplay }

      - key: IS_PVP
        label: PvP mode
        type: bool
        default: "False"
        trueValue: "True"
        falseValue: "False"
        bindings:
          - { surface: env, direction: write, key: IS_PVP }
          - { surface: palworldsettings, direction: read, mirrorWrite: true, member: bIsPvP }

      - key: CAN_PICKUP_OTHER_GUILD_DEATH_PENALTY_DROP
        label: Allow pickup of other guilds' death-penalty drops
        type: bool
        default: "False"
        trueValue: "True"
        falseValue: "False"
        bindings:
          - { surface: env, direction: write, key: CAN_PICKUP_OTHER_GUILD_DEATH_PENALTY_DROP }
          - { surface: palworldsettings, direction: read, mirrorWrite: true,
              member: bCanPickupOtherGuildDeathPenaltyDrop }

      - key: ENABLE_NON_LOGIN_PENALTY
        label: Enable non-login penalty
        type: bool
        default: "True"
        trueValue: "True"
        falseValue: "False"
        bindings:
          - { surface: env, direction: write, key: ENABLE_NON_LOGIN_PENALTY }
          - { surface: palworldsettings, direction: read, mirrorWrite: true, member: bEnableNonLoginPenalty }

      - key: ENABLE_FAST_TRAVEL
        label: Enable fast travel
        type: bool
        default: "True"
        trueValue: "True"
        falseValue: "False"
        bindings:
          - { surface: env, direction: write, key: ENABLE_FAST_TRAVEL }
          - { surface: palworldsettings, direction: read, mirrorWrite: true, member: bEnableFastTravel }

      - key: IS_START_LOCATION_SELECT_BY_MAP
        label: Allow start-location selection by map
        type: bool
        default: "False"
        trueValue: "True"
        falseValue: "False"
        bindings:
          - { surface: env, direction: write, key: IS_START_LOCATION_SELECT_BY_MAP }
          - { surface: palworldsettings, direction: read, mirrorWrite: true, member: bIsStartLocationSelectByMap }

      - key: EXIST_PLAYER_AFTER_LOGOUT
        label: Keep player character after logout
        type: bool
        default: "False"
        trueValue: "True"
        falseValue: "False"
        bindings:
          - { surface: env, direction: write, key: EXIST_PLAYER_AFTER_LOGOUT }
          - { surface: palworldsettings, direction: read, mirrorWrite: true, member: bExistPlayerAfterLogout }

      - key: ENABLE_DEFENSE_OTHER_GUILD_PLAYER
        label: Allow defending against other guild players
        type: bool
        default: "False"
        trueValue: "True"
        falseValue: "False"
        bindings:
          - { surface: env, direction: write, key: ENABLE_DEFENSE_OTHER_GUILD_PLAYER }
          - { surface: palworldsettings, direction: read, mirrorWrite: true, member: bEnableDefenseOtherGuildPlayer }

      - key: COOP_PLAYER_MAX_NUM
        label: Max players per co-op party
        type: int
        min: 1
        max: 8
        default: 4
        bindings:
          - { surface: env, direction: write, key: COOP_PLAYER_MAX_NUM }
          - { surface: palworldsettings, direction: read, mirrorWrite: true, member: CoopPlayerMaxNum }

  - group: Security
    items:
      - key: admin-password
        label: Admin / RCON password
        type: secret
        required: true
        bindings:
          - { surface: env, direction: write, key: ADMIN_PASSWORD }
          - { surface: palworldsettings, direction: read, member: AdminPassword, sensitive: true }
      - key: server-password
        label: Join password
        type: secret
        bindings:
          - { surface: env, direction: write, key: SERVER_PASSWORD }
          - { surface: palworldsettings, direction: read, member: ServerPassword, sensitive: true }

      - key: RCON_ENABLED
        label: Enable RCON
        type: bool
        default: "false"
        trueValue: "true"          # this image renders this one member lowercase in both .env and the ini,
        falseValue: "false"        # unlike every other bool in this file - see control.channels[rcon].enabledWhen
        bindings:
          - { surface: env, direction: write, key: RCON_ENABLED }
          - { surface: palworldsettings, direction: read, mirrorWrite: true, member: RCONEnabled }

      - key: REST_API_ENABLED
        label: Enable REST API
        type: bool
        default: "False"
        trueValue: "True"
        falseValue: "False"
        bindings:
          - { surface: env, direction: write, key: REST_API_ENABLED }
          - { surface: palworldsettings, direction: read, mirrorWrite: true, member: RESTAPIEnabled }

      - key: USEAUTH
        label: Require Palworld account sign-in
        type: bool
        default: "True"
        trueValue: "True"
        falseValue: "False"
        bindings:
          - { surface: env, direction: write, key: USEAUTH }
          - { surface: palworldsettings, direction: read, mirrorWrite: true, member: bUseAuth }

      - key: BAN_LIST_URL
        label: Ban list URL
        type: string
        default: "https://b.palworldgame.com/api/banlist.txt"
        bindings:
          - { surface: env, direction: write, key: BAN_LIST_URL }
          - { surface: palworldsettings, direction: read, mirrorWrite: true, member: BanListURL, unquote: true }

      - key: REGION
        label: Region tag
        type: string
        default: ""
        bindings:
          - { surface: env, direction: write, key: REGION }
          - { surface: palworldsettings, direction: read, mirrorWrite: true, member: Region, unquote: true }

      - key: SHOW_PLAYER_LIST
        label: Show player list publicly
        type: bool
        default: "False"
        trueValue: "True"
        falseValue: "False"
        bindings:
          - { surface: env, direction: write, key: SHOW_PLAYER_LIST }
          - { surface: palworldsettings, direction: read, mirrorWrite: true, member: bShowPlayerList }

      - key: CHAT_POST_LIMIT_PER_MINUTE
        label: Chat messages per minute limit
        type: int
        min: 0
        max: 100
        default: 30
        bindings:
          - { surface: env, direction: write, key: CHAT_POST_LIMIT_PER_MINUTE }
          - { surface: palworldsettings, direction: read, mirrorWrite: true, member: ChatPostLimitPerMinute }

  - group: "Pal & Combat Rates"
    items:
      - key: PAL_CAPTURE_RATE
        label: Pal capture rate
        type: float
        min: 0.1
        max: 5.0
        step: 0.1
        default: "1.000000"
        renderFormat: "F6"
        bindings:
          - { surface: env, direction: write, key: PAL_CAPTURE_RATE }
          - { surface: palworldsettings, direction: read, mirrorWrite: true, member: PalCaptureRate }

      - key: PAL_SPAWN_NUM_RATE
        label: Pal spawn number rate
        type: float
        min: 0.1
        max: 3.0
        step: 0.1
        default: "1.000000"
        renderFormat: "F6"
        bindings:
          - { surface: env, direction: write, key: PAL_SPAWN_NUM_RATE }
          - { surface: palworldsettings, direction: read, mirrorWrite: true, member: PalSpawnNumRate }

      - key: PAL_DAMAGE_RATE_ATTACK
        label: Pal attack damage rate
        type: float
        min: 0.1
        max: 10.0
        step: 0.1
        default: "1.000000"
        renderFormat: "F6"
        bindings:
          - { surface: env, direction: write, key: PAL_DAMAGE_RATE_ATTACK }
          - { surface: palworldsettings, direction: read, mirrorWrite: true, member: PalDamageRateAttack }

      - key: PAL_DAMAGE_RATE_DEFENSE
        label: Pal defense damage rate
        type: float
        min: 0.1
        max: 10.0
        step: 0.1
        default: "1.000000"
        renderFormat: "F6"
        bindings:
          - { surface: env, direction: write, key: PAL_DAMAGE_RATE_DEFENSE }
          - { surface: palworldsettings, direction: read, mirrorWrite: true, member: PalDamageRateDefense }

      - key: PLAYER_DAMAGE_RATE_ATTACK
        label: Player attack damage rate
        type: float
        min: 0.1
        max: 10.0
        step: 0.1
        default: "1.000000"
        renderFormat: "F6"
        bindings:
          - { surface: env, direction: write, key: PLAYER_DAMAGE_RATE_ATTACK }
          - { surface: palworldsettings, direction: read, mirrorWrite: true, member: PlayerDamageRateAttack }

      - key: PLAYER_DAMAGE_RATE_DEFENSE
        label: Player defense damage rate
        type: float
        min: 0.1
        max: 10.0
        step: 0.1
        default: "1.000000"
        renderFormat: "F6"
        bindings:
          - { surface: env, direction: write, key: PLAYER_DAMAGE_RATE_DEFENSE }
          - { surface: palworldsettings, direction: read, mirrorWrite: true, member: PlayerDamageRateDefense }

      - key: PLAYER_STOMACH_DECREASE_RATE
        label: Player stomach (hunger) decrease rate
        type: float
        min: 0.1
        max: 5.0
        step: 0.1
        default: "1.000000"
        renderFormat: "F6"
        bindings:
          - { surface: env, direction: write, key: PLAYER_STOMACH_DECREASE_RATE }
          - { surface: palworldsettings, direction: read, mirrorWrite: true, member: PlayerStomachDecreaceRate }

      - key: PLAYER_STAMINA_DECREASE_RATE
        label: Player stamina decrease rate
        type: float
        min: 0.1
        max: 5.0
        step: 0.1
        default: "1.000000"
        renderFormat: "F6"
        bindings:
