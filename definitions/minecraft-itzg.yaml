apiVersion: servyx.dev/v1
kind: GameDefinition
metadata:
  id: minecraft-itzg
  name: Minecraft Server (itzg)
  version: 1.0.0
  license: MIT
  tags: [survival, java, sandbox]

capabilities:
  network:
    - { port: 25565, protocol: tcp, purpose: game, var: SERVER_PORT, published: true }
    - { port: 25575, protocol: tcp, purpose: rcon,  var: RCON_PORT,  published: false }
  filesystem:
    - { path: "${DATA_DIR}", access: rw, purpose: "world saves, server.properties, EULA acceptance, mods/plugins, logs" }
  egress:
    - { destination: piston-data.mojang.com, port: 443, purpose: "downloads the vanilla server jar and version manifest on first boot or version change" }
    - { destination: libraries.minecraft.net, port: 443, purpose: "Forge/Fabric/Paper loader and library downloads for non-vanilla server types" }
  shell: false
  privileged: false
  hostNetwork: false

deployments:

  # -- The image the vast majority of itzg/minecraft-server operators actually run -----------------------
  - id: docker-itzg
    kind: docker
    detect:
      imageRepo: "itzg/minecraft-server"
      requiredMounts: [{ containerPath: /data }]
    image:
      default: "itzg/minecraft-server:latest"
    dataDir: /data

    # Servyx's own orchestration budget for a graceful stop: comfortably covers the full lifecycle.stop
    # ladder below (30s + 30s + 120s = 180s) plus headroom for RCON round-trip latency, mirroring
    # definitions/ark-asa-pok.yaml's precedent of sizing this above the ladder total rather than guessing.
    stopTimeout: 190s

    # Docker's own stop grace period defaults to just 10 SECONDS — nowhere near enough for a large world's
    # save (the ladder below budgets 120s for SIGTERM alone, on top of the RCON save-all/stop pair). Without
    # this field, Docker would SIGKILL the java process at the 10s mark, almost certainly mid-write to the
    # region files, corrupting world state. Set to the ladder's total (180s) plus headroom; the parser
    # hard-errors if this is ever less than the ladder's stage-timeout sum (see ResolveDeferredChecks in
    # GameDefinitionYamlParser.Semantics.cs).
    stopGracePeriodSeconds: 200

    config:
      surfaces:
        # THE source of truth for this image: every setting below is an environment variable the
        # entrypoint reads on container start.
        - id: env
          role: authoritative
          format: dotenv
          locator: { kind: host-file, path: "${COMPOSE_DIR}/.env" }
          mergePolicy: preserve-unknown

        # Ports, volumes, restart policy, container name.
        - id: compose
          role: authoritative
          format: yaml
          locator: { kind: host-file, path: "${COMPOSE_DIR}/compose.yaml" }
          managedSubtree: "services.minecraft"
          mergePolicy: preserve-unknown

        # GENERATED by the image's entrypoint scripts at boot from `env` — every key whose env var is set
        # is rewritten; every other key is left as the server (or a previous manual edit) last wrote it.
        # Servyx reads it to compute effective values and detect drift, and never writes it.
        #
        # DECISION (audit delta #5): OVERRIDE_SERVER_PROPERTIES is deliberately left at the image's own
        # default (true) rather than set to 'false'. The alternative — flipping it off and modeling
        # server.properties as 'authoritative' so Servyx could write to it directly — was rejected because
        # this surface is already, and remains, 'derived': Servyx never writes to server.properties itself,
        # only to 'env'. Under that model there is no Servyx-originated edit for OVERRIDE_SERVER_PROPERTIES
        # to silently discard on restart — the regeneration is exactly what makes 'env' authoritative and
        # 'properties' safe to treat as read-only, mirroring definitions/palworld-docker.yaml's
        # 'palworldsettings' surface precedent for a wholesale-regenerated file. An operator who hand-edits
        # server.properties directly (bypassing Servyx) will still lose that edit on next restart — that is
        # the image's documented behavior, not a Servyx bug, and is exactly what the 'derived' role/
        # 'regeneration' block below exist to make visible rather than hide.
        - id: properties
          role: derived
          format: properties
          locator: { kind: host-file, path: "${DATA_DIR}/server.properties" }
          derivedFrom: [env]
          regeneration:
            kind: container-restart
            description: "Rewritten from environment variables by the image's entrypoint scripts on every start; keys with no corresponding env var are left untouched."

lifecycle:
  ready:
    - kind: log-regex
      pattern: 'Done \([0-9.]+s\)! For help, type "help"'
      timeout: 10m
    - kind: control-probe            # fallback when upstream changes the log line
      channel: rcon
      command: list
      expect: 'players online'
      interval: 15s
      timeout: 12m

  # Load-bearing ladder: save-all flush -> stop -> SIGTERM -> SIGKILL. Budgeted 30s + 30s + 120s = 180s
  # total (see 'stopGracePeriodSeconds' above). A bare 'stop' without a preceding flush risks the RCON
  # command racing the world's own autosave; explicitly flushing first (audit delta per verified facts:
  # "save-all flush -> stop -> SIGTERM") removes that race.
  stop:
    # 1) Force an immediate, synchronous write of all loaded chunks before anything destructive happens.
    #    'continueOnError: true' is the 'control' stage default — spelled out explicitly here rather than
    #    left implicit, same as definitions/ark-asa-pok.yaml — because an unreachable RCON channel is the
    #    single most common reason a control stage fails, and escalating past it is exactly what the rest
    #    of this ladder exists for.
    - { kind: control, channel: rcon, command: save-all, timeout: 30s, continueOnError: true }
    # 2) Ask the vanilla/Paper/Forge process to shut itself down cleanly via its own console command.
    - { kind: control, channel: rcon, command: stop, timeout: 30s, continueOnError: true }
    # 3) A genuine escalation past RCON, sized to the STOP_DURATION setting below (default 120s): the
    #    image's own entrypoint (mc-server-runner) intercepts SIGTERM and waits up to STOP_DURATION for the
    #    java process to exit before it force-kills internally. Giving this stage the same budget means
    #    Servyx's own ladder does not race — and prematurely override — that internal grace window.
    #    Defaults to (and is set here) 'continueOnError: false': a runtime that refuses to deliver SIGTERM
    #    at all is a real fault worth surfacing, not one to paper over.
    - { kind: signal, signal: SIGTERM, timeout: 120s, continueOnError: false }
    # 4) Unconditional, terminal. By the time the ladder reaches here (~180s in), save-all already ran in
    #    stage 1, so this is a last resort against a wedged process, not a point where world state is lost.
    - { kind: kill }

  crashDetection:
    - { kind: log-regex, pattern: 'Exception in server tick loop|java\.lang\.OutOfMemoryError', action: mark-crashed }

  # No healthSignal block: unlike thijsvanloef/palworld-server-docker, this image ships no container-level
  # HEALTHCHECK for Servyx to distrust — there is nothing here to document an override for, so the generic,
  # game-neutral explanation applies untouched whenever Docker reports this container unhealthy for some
  # other reason (e.g. the process itself died).

control:
  channels:
    - id: rcon
      protocol: source-rcon
      port: "${RCON_PORT}"
      passwordRef: "secret:rcon-password"
      enabledWhen: "env.ENABLE_RCON == 'true'"
      reachability:                  # ordered; first available wins
        - kind: direct-tcp           # only if the port is published
        - kind: docker-exec-tool     # what actually works on this container — the image bundles itzg's
          tool: rcon-cli             # own rcon-cli, which already reads RCON_PORT/RCON_PASSWORD from the
          argv: ["rcon-cli", "{command}"]  # container's own environment with no flags needed.
        - kind: docker-exec-network  # nc from a sibling container on the same compose network
      commands:
        list:      { template: "list",                readOnly: true }
        # 'save-all flush' rather than a bare 'save-all': flush forces a synchronous write of every loaded
        # chunk instead of merely queuing one, which is what both the stop ladder above and the backup
        # quiesce sequence below rely on to guarantee the world is actually on disk before they proceed.
        save-all:  { template: "save-all flush",       readOnly: false }
        # save-off/save-on: the canonical Minecraft "quiesce" pair — disable then re-enable the periodic
        # autosave so a backup's file copy cannot race a write. See 'backup.quiesce'/'backup.resume' below.
        save-off:  { template: "save-off",              readOnly: false }
        save-on:   { template: "save-on",               readOnly: false }
        stop:      { template: "stop",                 readOnly: false }
        say:       { template: "say {message}",        readOnly: false }
        kick:      { template: "kick {player}",        readOnly: false }
        ban:       { template: "ban {player}",         readOnly: false }

  players:
    preferred: [rcon.list]
    pollInterval: 30s
    parsers:
      # UNVERIFIED (audit delta #1): the exact reply text of the 'list' RCON command — especially the
      # zero-player case — could not be confirmed against a real captured fixture. Community tooling parses
      # it as "There are N of a max[ of] M players online[:][ name1, name2, ...]", but the optional " of"
      # and the trailing colon are known to vary by server version. The pattern below is deliberately
      # permissive rather than precise: it declares 'count' (required by this parser shape) plus the
      # optional 'max'/'names' groups, and a reply that does not match degrades to
      # PlayerListFidelity.Unknown by design (see the remarks on PlayerParserSpec in Servyx.Domain) rather
      # than throwing or mis-attributing a name/count. A mis-parse here cannot affect readiness (the
      # 'control-probe' fallback above only substring-matches 'players online', which is stable across the
      # variants) or the stop ladder. Tighten this pattern from a captured fixture once real 'list' output
      # has been observed; do not treat the shape below as confirmed.
      rcon.list:
        kind: summary-line
        pattern: 'There are (?<count>\d+) of a max(?: of)? (?<max>\d+) players online:?(?<names>.*)'
        nameSeparator: ", "

settings:
  - group: Identity
    items:
      - key: MOTD
        label: Message of the day
        type: string
        maxLength: 59
        bindings:
          - { surface: env,        direction: write, key: MOTD }
          - { surface: properties, direction: read,  key: motd }

      - key: LEVEL
        label: World name
        type: string
        default: world
        requiresRecreate: true
        bindings:
          - { surface: env,        direction: write, key: LEVEL }
          - { surface: properties, direction: read,  key: level-name }

  - group: Networking
    items:
      - key: SERVER_PORT
        label: Game port
        type: port
        default: 25565
        requiresRecreate: true       # env is baked at container create
        bindings:
          - { surface: env,     direction: write, key: SERVER_PORT }
          - { surface: compose, direction: write,
              pointer: "/services/minecraft/ports", strategy: publish-tcp }
          - { surface: properties, direction: read, key: server-port }

      - key: RCON_PORT
        label: RCON port
        type: port
        default: 25575
        publishByDefault: false      # Servyx will not expose RCON to the host network
        bindings:
          - { surface: env,        direction: write, key: RCON_PORT }
          - { surface: properties, direction: read,  key: rcon.port }

  - group: Gameplay
    items:
      - key: TYPE
        label: Server type
        type: enum
        values: [VANILLA, PAPER, SPIGOT, FORGE, FABRIC, PURPUR]
        default: VANILLA
        requiresRecreate: true
        bindings:
          - { surface: env, direction: write, key: TYPE }

      - key: VERSION
        label: Minecraft version
        type: string
        default: LATEST
        requiresRecreate: true
        bindings:
          - { surface: env, direction: write, key: VERSION }

      - key: MEMORY
        label: JVM heap size
        type: string
        default: 2G
        pattern: '^[0-9]+[MG]$'
        requiresRecreate: true
        bindings:
          - { surface: env, direction: write, key: MEMORY }

      - key: DIFFICULTY
        label: Difficulty
        type: enum
        values: [peaceful, easy, normal, hard]
        default: easy
        bindings:
          - { surface: env,        direction: write, key: DIFFICULTY }
          - { surface: properties, direction: read,  key: difficulty }

      - key: MAX_PLAYERS
        label: Max players
        type: int
        min: 1
        max: 200
        default: 20
        bindings:
          - { surface: env,        direction: write, key: MAX_PLAYERS }
          - { surface: properties, direction: read,  key: max-players }

      - key: PVP
        label: Enable PvP
        type: bool
        trueValue: "true"
        falseValue: "false"
        default: "true"
        bindings:
          - { surface: env,        direction: write, key: PVP }
          - { surface: properties, direction: read,  key: pvp }

      # Audit delta (Step 2 verified facts): the image's own STOP_DURATION default (60s) is not sized for a
      # large world's flush-and-stop sequence. Raised to 120s here to match the SIGTERM stage timeout in
      # 'lifecycle.stop' above, so the entrypoint's own internal grace window and Servyx's own ladder agree
      # on how long a graceful stop is allowed to take. No 'properties' binding: this knob controls the
      # entrypoint's shutdown behavior, not anything server.properties records.
      - key: STOP_DURATION
        label: Graceful stop duration (seconds)
        type: int
        min: 1
        default: 120
        bindings:
          - { surface: env, direction: write, key: STOP_DURATION }

  - group: Legal
    items:
      - key: EULA
        label: Accept the Minecraft EULA (https://aka.ms/MinecraftEULA)
        type: bool
        required: true
        trueValue: "true"
        falseValue: "false"
        bindings:
          - { surface: env, direction: write, key: EULA }

  - group: Security
    items:
      - key: ENABLE_RCON
        label: Enable RCON
        type: bool
        trueValue: "true"
        falseValue: "false"
        default: "true"
        bindings:
          - { surface: env,        direction: write, key: ENABLE_RCON }
          - { surface: properties, direction: read,  key: enable-rcon }

      # Audit delta (Step 3 #6): bound from a declared secret rather than left to the image's own random
      # default. 'required: true' and no 'default' — the parser rejects a literal default on a secret item,
      # and relying on the image's own randomly-generated RCON_PASSWORD would leave Servyx unable to know
      # the value it needs to actually reach the control channel.
      - key: rcon-password
        label: RCON password
        type: secret
        required: true
        bindings:
          - { surface: env,        direction: write, key: RCON_PASSWORD }
          - { surface: properties, direction: read,  key: rcon.password, sensitive: true }

backup:
  include:
    - "${DATA_DIR}/world/**"
    - "${DATA_DIR}/world_nether/**"
    - "${DATA_DIR}/world_the_end/**"
    - "${DATA_DIR}/server.properties"
    - "${DATA_DIR}/eula.txt"
    - "${COMPOSE_DIR}/.env"
    - "${COMPOSE_DIR}/compose.yaml"
  exclude:
    - "${DATA_DIR}/logs/**"
    - "${DATA_DIR}/crash-reports/**"
    # Audit delta (Step 3 #8): the image's own download/version cache and library jars — neither is world
    # data, and both are trivially re-downloaded on next boot from VERSION/TYPE, so re-archiving them would
    # only inflate every backup for no restorability benefit.
    - "${DATA_DIR}/cache/**"
    - "${DATA_DIR}/libraries/**"
    # The server jar itself (vanilla/Paper/Forge/Fabric launcher jar, filename varies by TYPE/VERSION) sits
    # directly under DATA_DIR and is likewise re-downloaded on boot, not world state.
    - "${DATA_DIR}/*.jar"
    # session.lock is a live advisory lock file the running server holds over each world directory — not
    # world data, and copying it into a backup is actively misleading (a restored world must never carry a
    # stale lock from a different process). Matched under any world dir via '**' rather than a fixed depth.
    - "${DATA_DIR}/**/session.lock"
  # Canonical safe backup sequence (Step 3 #4, now supported by the parser): quiesce disables the periodic
  # autosave and forces one final synchronous flush before capture; resume re-enables it afterwards. Resume
  # runs in a 'finally' opened before quiesce executes and on its own cancellation token, so a mid-quiesce
  # failure or a cancelled backup still leaves autosave re-enabled rather than leaving the world perpetually
  # unprotected.
  quiesce:
    - { kind: control, channel: rcon, command: save-off, timeout: 30s }
    - { kind: control, channel: rcon, command: save-all, timeout: 30s }
  resume:
    - { kind: control, channel: rcon, command: save-on,  timeout: 30s }
  # No 'adopt': unlike thijsvanloef/palworld-server-docker, this image ships no cron-based backup rotation
  # of its own, so there is no foreign archive source to declare here.
  defaultRetention: { keepHourly: 6, keepDaily: 7, keepWeekly: 4 }

saves:
  worldRoot: "${DATA_DIR}"
  worldIdPattern: "^world(_nether|_the_end)?$"
  levelFile: "level.dat"
  metaFile: "level.dat"
  playerDir: "playerdata"

mods:
  supported: true
